# Host ports are deliberately off the defaults: this machine runs long-lived
# containers from another project on 5432 / 5672 / 15672 / 6379 / 9092. Container-side
# ports are unchanged, so connection strings inside the compose network stay standard.
name: aperture   # without this the project is named after the folder ("deploy")

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aperture
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
    ports: ["5433:5432"]
    volumes: ["aperture-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture"]
      interval: 5s
      retries: 10

  mq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aperture
      RABBITMQ_DEFAULT_PASS: aperture
    ports: ["5673:5672", "15673:15672"]

volumes:
  aperture-db:
