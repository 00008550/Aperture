name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aperture.slnx

      # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails here.
      # --no-restore keeps the restore failure separate from the compile failure.
      - name: Build
        run: dotnet build Aperture.slnx --configuration Release --no-restore

      # No LogFileName: with a fixed name every test project writes the same file and the
      # last one wins, so the assertion below would only ever have counted one project.
      - name: Test
        run: >
          dotnet test Aperture.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory ./TestResults

      # A test run that discovers zero tests must not read as success. This is the
      # 001-P1 review finding turned into a build step.
      # Sums every project's trx, not just one. grep -o rather than -P, and awk rather than
      # bc: PCRE mode refuses to run under a non-UTF-8 locale and bc is not installed
      # everywhere. Neither difference between this runner and a developer machine should
      # decide whether the build passes.
      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          files=$(ls TestResults/*.trx 2>/dev/null | wc -l)
          total=$(grep -ho 'total="[0-9]*"' TestResults/*.trx | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          echo "executed tests: ${total:-0} across ${files} result file(s)"
          if [ "${files}" -lt 1 ] || [ "${total:-0}" -lt 1 ]; then
            echo "::error::dotnet test discovered no tests — a green run here proves nothing"
            exit 1
          fi
          echo "### ✅ $total backend tests executed across $files project(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this covers the typecheck.
      # tsconfig runs strict with noUncheckedIndexedAccess and exactOptionalPropertyTypes.
      - name: Typecheck and build
        run: npm run build

  invariants:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # scripts/measure.sh gate fails the build on the two rules that are worth failing
      # a build over, both from CLAUDE.md:
      #   1. every mapped route carries an authorization policy
      #   2. every raw SQL call passes tenant_id explicitly — EF's global query filter
      #      does not reach Dapper, which is the sharp edge of the tenancy design
      - name: Gate
        run: bash scripts/measure.sh gate

      - name: Publish the measurement
        if: always()
        run: |
          {
            echo '## Ground truth'
            echo '```'
            bash scripts/measure.sh all
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# Note on the backend job: the Access module's tests spin up PostgreSQL through
# Testcontainers and apply the real migration, so they need a Docker daemon. ubuntu-latest
# provides one; a self-hosted runner would need docker available to the job user.
